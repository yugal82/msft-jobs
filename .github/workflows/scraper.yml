name: Microsoft Job Scraper

on:
  # Run every 30 minutes during business hours (Mon-Fri, 8:30 AM - 5:00 PM Pacific)
  # Cron is in UTC, so these cover the window in both PDT (UTC-7: 15:30-00:00 UTC)
  # and PST (UTC-8: 16:30-01:00 UTC). The business-hours step skips runs outside it.
  schedule:
    - cron: '30 15 * * 1-5'
    - cron: '0,30 16-23 * * 1-5'
    - cron: '0,30 0 * * 2-6'
    - cron: '0 1 * * 2-6'
  workflow_dispatch:  # Allow manual trigger (ignores business hours)

# Never let two runs commit and push at the same time
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit and push

    steps:
    - name: Check if business hours (Pacific)
      id: check_hours
      run: |
        # TZ='America/Los_Angeles' handles both PST and PDT automatically
        DAY_OF_WEEK=$(TZ='America/Los_Angeles' date +%u)  # 1=Monday, 7=Sunday
        HHMM=$(TZ='America/Los_Angeles' date +%H%M)
        echo "Current Pacific time: $(TZ='America/Los_Angeles' date '+%a %H:%M')"

        # 8:30 AM - 5:00 PM, plus 15 minutes of grace since GitHub often starts scheduled runs late
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
           { [ "$DAY_OF_WEEK" -le 5 ] && [ $((10#$HHMM)) -ge 830 ] && [ $((10#$HHMM)) -le 1715 ]; }; then
          echo "inside_hours=true" >> $GITHUB_OUTPUT
        else
          echo "inside_hours=false" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository
      if: steps.check_hours.outputs.inside_hours == 'true'
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Full history so the scraper can rebase before pushing

    - name: Configure Git
      if: steps.check_hours.outputs.inside_hours == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Set up Python
      if: steps.check_hours.outputs.inside_hours == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      if: steps.check_hours.outputs.inside_hours == 'true'
      run: pip install -r requirements.txt

    - name: Run scraper
      if: steps.check_hours.outputs.inside_hours == 'true'
      run: python3 scraper.py
